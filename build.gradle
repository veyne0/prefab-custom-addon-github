plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    flatDir {
        dirs 'libs'
    }
    maven { url = 'https://maven.aliyun.com/repository/public' }
    maven { url = 'https://maven.aliyun.com/repository/gradle-plugin' }
    maven { url = 'https://maven.neoforged.net/releases/' }
    maven { url = 'https://maven.parchmentmc.org' } // Parchment mappings
    maven { url = 'https://jitpack.io' }
    mavenCentral()
}

base {
    archivesName = archives_base_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    // 启用 Parchment mappings（与 NeoForge 主模组保持一致）
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.WARN
        }

        client {
            client()
        }

        server {
            server()
        }
    }
}

dependencies {
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation name: 'ldlib2', version: '2.2.18'
    // Prefab 主模组（用于复用其 GuiStructure、Structure、BuildBlock 等类）
    compileOnly files('libs/prefab-neoforge-1.0.8.jar')
    compileOnly 'org.appliedenergistics.yoga:yoga:1.0.0'
    compileOnly 'dev.vfyjxf:taffy:1.1.4'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-Xlint:deprecation')
}

jar {
    manifest {
        attributes(
            'Specification-Title': 'PrefabCustomAddon',
            'Specification-Vendor': 'veyne',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'veyne'
        )
    }
}

